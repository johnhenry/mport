name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when new commits land on the same ref. The reusable
# `test` job carries the family's own group (ci-<workflow>-<ref>); this one is
# deliberately named differently so the caller group never cancels the called one.
concurrency:
  group: mport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The family gate: install, typecheck, test, examples, pack. Node 26 is the
  # engines floor (matches .nvmrc and publish.yml).
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npm run typecheck
        npm test
        npm run examples
        npm pack --dry-run

  # mport-specific, not expressible in the reusable workflow (it has no browser
  # matrix): the browser runtime (examples pages, startup(), createImporter(),
  # injectImportMap, injectModulePreload, import-map scopes and integrity) on each
  # engine. Pages are served from the repo by a static server Playwright starts;
  # every CDN request is stubbed, so nothing touches the network apart from
  # installing the browsers.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Size budgets (gating): the packed tarball and the gzip size of every entry point against package.json's
  # "sizeBudget" (scripts/size.mjs). The report is kept as an artifact so a failing run shows the numbers.
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run size -- --json size-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report
          path: size-report.json
          retention-days: 30

  # JSR readiness (gating, nothing is published): `jsr publish --dry-run` checks jsr.json (name, version, exports mirroring
  # package.json) and the public API's types (each entry carries a `@ts-self-types` comment pointing at its .d.ts).
  # Creating the package on jsr.io is a manual step for the owner (AGENTS.md, "JSR").
  jsr-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run jsr-dry-run

  # Numbers, not a gate: a slow runner must not fail the build. The run is stored as an artifact and compared with
  # the committed bench/baseline.json at a generous factor (3x); a regression is a warning annotation, never a failure.
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run bench -- --out bench-results.json
      - run: node bench/compare.mjs bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results.json
          retention-days: 30

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
