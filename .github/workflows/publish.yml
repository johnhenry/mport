name: Publish to npm

# Publish model: main is the release branch. A push to main publishes only if
# package.json's version isn't on npm yet (otherwise a clean no-op), then tags
# v<version> and creates a GitHub Release. See johnhenry/workflows' README.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # tag + GitHub Release by-product of npm-publish.yml
      id-token: write # npm provenance
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # The FULL gate, including the three-engine browser suite (ci.yml's `browser`
      # job, run here in one job because the reusable workflow takes a command list,
      # not a matrix). Install, typecheck, test, examples, then every Playwright
      # project; the npm view guard and `npm publish --provenance --access public`
      # run after this inside the reusable workflow.
      gate-commands: |
        npm run typecheck
        npm test
        npm run examples
        npx playwright install --with-deps chromium firefox webkit
        npm run test:browser
    secrets: inherit
