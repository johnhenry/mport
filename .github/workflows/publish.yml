name: Publish to npm

# Standard trigger (release: published + workflow_dispatch), plus a redundant
# `v*` tag-push trigger: creating a release very soon after a push/merge to the
# same commit can silently drop the release event for a job whose body is
# `uses: <external-repo>/...@v1` (see johnhenry/workflows' README). The tag push
# gives a second chance to fire; the `npm view` guard in the reusable workflow
# makes a double run a no-op.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required by the reusable workflow's provenance step -- must be declared here too
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # The FULL gate, including the three-engine browser suite (ci.yml's `browser`
      # job, run here in one job because the reusable workflow takes a command list,
      # not a matrix). Install, typecheck, test, examples, then every Playwright
      # project; the npm view guard and `npm publish --provenance --access public`
      # run after this inside the reusable workflow.
      gate-commands: |
        npm run typecheck
        npm test
        npm run examples
        npx playwright install --with-deps chromium firefox webkit
        npm run test:browser
    secrets: inherit
